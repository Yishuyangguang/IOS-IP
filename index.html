<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>美区 Apple ID 共享中心 - 实时自动同步</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍎</text></svg>">
  
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #e2e8f0;
      --success: #10b981;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --danger-text: #991b1b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 40px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px;
      width: 100%;
    }

    /* 顶部标题区 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
    }
    .badge-us {
      background: #eff6ff;
      color: var(--primary);
      border: 1px solid #bfdbfe;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
    }

    .btn-refresh {
      background: #ffffff;
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-refresh:hover { background: #f1f5f9; }

    /* 安全警告卡片 */
    .warning-banner {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 24px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .warning-icon { font-size: 20px; line-height: 1.2; }
    .warning-content { font-size: 13px; color: var(--danger-text); line-height: 1.6; }
    .warning-content b { color: #7f1d1d; }

    /* 状态与统计 */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 14px;
      padding: 0 4px;
    }

    /* 账号卡片网格 */
    .account-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card:hover {
      border-color: #cbd5e1;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .card-region {
      font-size: 12px;
      font-weight: 700;
      color: #059669;
      background: #ecfdf5;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .card-time {
      font-size: 11px;
      color: var(--text-muted);
    }

    .card-row {
      margin-bottom: 10px;
    }
    .card-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 600;
    }
    .card-val-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .card-val-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 8px;
    }

    .btn-copy {
      background: #ffffff;
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .btn-copy:hover {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }
    .btn-copy.copied {
      background: var(--success);
      color: #ffffff;
      border-color: var(--success);
    }

    /* 加载与空状态 */
    .loading-box {
      text-align: center;
      padding: 60px 0;
      color: var(--text-muted);
      font-size: 14px;
    }
    .empty-box {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      background: #fff;
      border-radius: 16px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 13px;
    }

    /* 吐司提示 (Toast) */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.9);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 600;
      backdrop-filter: blur(8px);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10000;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 头部区域 -->
    <header>
      <div class="header-title">
        <span>🍎 Apple ID 共享池</span>
        <span class="badge-us">🇺🇸 仅展示美国区</span>
      </div>
      <button class="btn-refresh" id="refreshBtn" onclick="fetchAccounts(true)">
        <span id="refreshIcon">🔄</span> 刷新列表
      </button>
    </header>

    <!-- 安全警示 -->
    <div class="warning-banner">
      <div class="warning-icon">⚠️</div>
      <div class="warning-content">
        <b>严禁在系统【设置】中登录 iCloud</b>，必须且仅可在 <b>App Store（应用商店）</b> 内登录，否则可能导致设备被远程锁定！<br>
        登录时若弹出“Apple ID 安全 / 双重认证”，请务必点击 <b>【其他选项】➔【不升级】</b>。
      </div>
    </div>

    <!-- 状态指示 -->
    <div class="status-bar">
      <span id="accountCountText">正在抓取最新可用账号...</span>
      <span id="lastCheckTimeText">最后同步: --:--:--</span>
    </div>

    <!-- 账号列表容器 -->
    <div class="account-grid" id="accountContainer">
      <div class="loading-box" style="grid-column: 1 / -1;">
        ⏳ 正在实时拉取并筛选美国 Apple ID，请稍候...
      </div>
    </div>
  </div>

  <div id="toast">✓ 已复制到剪贴板</div>

  <script>
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function copyText(text, btnElement) {
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        showToast(`✓ 已复制: ${text}`);
        if (btnElement) {
          const originalText = btnElement.innerText;
          btnElement.innerText = "已复制";
          btnElement.classList.add('copied');
          setTimeout(() => {
            btnElement.innerText = originalText;
            btnElement.classList.remove('copied');
          }, 1500);
        }
      }).catch(() => {
        showToast("❌ 复制失败，请手动选择复制");
      });
    }

    async function fetchAccounts(isManual = false) {
      const container = document.getElementById('accountContainer');
      const countEl = document.getElementById('accountCountText');
      const timeEl = document.getElementById('lastCheckTimeText');
      const refreshIcon = document.getElementById('refreshIcon');

      if (isManual) {
        refreshIcon.style.display = 'inline-block';
        refreshIcon.style.transform = 'rotate(360deg)';
        refreshIcon.style.transition = 'transform 0.5s';
      }

      try {
        // 请求同源 Worker 提供的解析接口
        const res = await fetch('/api/appleid');
        const data = await res.json();

        if (data.success && Array.isArray(data.accounts)) {
          renderList(data.accounts);
          countEl.innerText = `找到 ${data.accounts.length} 个可用美国账号 (已去重)`;
        } else {
          throw new Error(data.error || "获取异常");
        }
      } catch (err) {
        container.innerHTML = `
          <div class="empty-box">
            ❌ 数据拉取失败，源站可能正在维护或受到频控。<br>
            <button class="btn-refresh" style="margin: 12px auto 0;" onclick="fetchAccounts(true)">重试</button>
          </div>
        `;
        countEl.innerText = "获取失败";
      } finally {
        const d = new Date();
        timeEl.innerText = `最后同步: ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}`;
        if (isManual) {
          setTimeout(() => {
            refreshIcon.style.transform = 'none';
            refreshIcon.style.transition = 'none';
          }, 500);
        }
      }
    }

    function renderList(accounts) {
      const container = document.getElementById('accountContainer');

      if (accounts.length === 0) {
        container.innerHTML = `
          <div class="empty-box">
            🍃 当前暂无可用的美国地区 Apple ID 账号，请稍后重试。
          </div>
        `;
        return;
      }

      container.innerHTML = accounts.map((item, idx) => `
        <div class="card">
          <div>
            <div class="card-header">
              <span class="card-region">🇺🇸 ${escapeHtml(item.region || '美国')}</span>
              <span class="card-time">${escapeHtml(item.update_time || '刚刚更新')}</span>
            </div>

            <!-- 账号框 -->
            <div class="card-row">
              <div class="card-label">账号 (Apple ID)</div>
              <div class="card-val-box">
                <span class="card-val-text" title="${escapeHtml(item.account)}">${escapeHtml(item.account)}</span>
                <button class="btn-copy" onclick="copyText('${escapeHtml(item.account)}', this)">复制</button>
              </div>
            </div>

            <!-- 密码框 -->
            <div class="card-row">
              <div class="card-label">密码 (Password)</div>
              <div class="card-val-box">
                <span class="card-val-text" title="${escapeHtml(item.password)}">${escapeHtml(item.password)}</span>
                <button class="btn-copy" onclick="copyText('${escapeHtml(item.password)}', this)">复制</button>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(s) {
      return (s || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetchAccounts();
      // 每 5 分钟自动静默刷新一次
      setInterval(() => fetchAccounts(false), 5 * 60 * 1000);
    });
  </script>
</body>
</html>
