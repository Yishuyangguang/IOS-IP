<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>全区 Apple ID 共享中心 - 实时自动同步</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍎</text></svg>">
  
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #e2e8f0;
      --success: #10b981;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --danger-text: #991b1b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 50px;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
      padding: 24px 16px;
      width: 100%;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-title {
      font-size: 22px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-refresh {
      background: #ffffff;
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-refresh:hover { background: #f1f5f9; border-color: #cbd5e1; }

    /* 防锁机警示 */
    .warning-banner {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .warning-icon { font-size: 22px; line-height: 1.2; }
    .warning-content { font-size: 13px; color: var(--danger-text); line-height: 1.6; }
    .warning-content b { color: #7f1d1d; }

    /* 筛选与搜索 */
    .filter-section {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .filter-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .filter-chip {
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 700;
      background: #f1f5f9;
      color: var(--text-muted);
      cursor: pointer;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .filter-chip.active {
      background: var(--primary);
      color: #ffffff;
    }

    .search-input {
      width: 100%;
      padding: 9px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 13px;
      outline: none;
      background: #f8fafc;
      font-family: inherit;
    }
    .search-input:focus {
      border-color: var(--primary);
      background: #ffffff;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 14px;
      padding: 0 4px;
    }

    /* 账号卡片 */
    .account-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card:hover {
      border-color: #cbd5e1;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .card-region {
      font-size: 12px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 8px;
      background: #eff6ff;
      color: var(--primary);
    }
    .card-time {
      font-size: 11px;
      color: var(--text-muted);
    }

    .card-row {
      margin-bottom: 10px;
    }
    .card-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 600;
    }
    .card-val-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .card-val-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 8px;
    }

    .btn-copy {
      background: #ffffff;
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .btn-copy:hover {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }
    .btn-copy.copied {
      background: var(--success);
      color: #ffffff;
      border-color: var(--success);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px 20px;
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 14px;
    }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.9);
      color: #ffffff;
      padding: 9px 18px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      backdrop-filter: blur(8px);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10000;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-title">
        <span>🍎 全区 Apple ID 共享池</span>
      </div>
      <button class="btn-refresh" onclick="fetchAccounts(true)">
        <span id="refreshIcon">🔄</span> 立即同步
      </button>
    </header>

    <!-- 严正警告 -->
    <div class="warning-banner">
      <div class="warning-icon">⚠️</div>
      <div class="warning-content">
        <b>严禁在手机系统【设置】中登录 iCloud</b>！必须且仅可在 <b>App Store（应用商店）</b> 登录。<br>
        登录提示“Apple ID 安全 / 双重认证”时，必须点击 <b>【其他选项】➔【不升级】</b>。
      </div>
    </div>

    <!-- 筛选面板 -->
    <div class="filter-section">
      <div class="filter-tabs" id="regionTabs">
        <button class="filter-chip active" onclick="setFilter('all', this)">全部</button>
      </div>
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 搜索国家地区或账号关键词..." oninput="handleSearch()">
    </div>

    <!-- 状态栏 -->
    <div class="status-bar">
      <span id="accountCountText">正在连接源站同步最新账号...</span>
      <span id="lastCheckTimeText">最后同步: --:--:--</span>
    </div>

    <!-- 账号卡片列表 -->
    <div class="account-grid" id="accountContainer">
      <div class="empty-state" style="grid-column: 1 / -1;">
        ⏳ 正在实时拉取并解密全量 Apple ID 数据，请稍候...
      </div>
    </div>
  </div>

  <div id="toast">✓ 已复制到剪贴板</div>

  <script>
    let allAccounts = [];
    let currentFilter = 'all';
    let searchQuery = '';

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function copyText(text, btnElement) {
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        showToast(`✓ 已复制: ${text}`);
        if (btnElement) {
          const org = btnElement.innerText;
          btnElement.innerText = "已复制";
          btnElement.classList.add('copied');
          setTimeout(() => {
            btnElement.innerText = org;
            btnElement.classList.remove('copied');
          }, 1500);
        }
      }).catch(() => {
        showToast("❌ 复制受阻，请手动复制");
      });
    }

    async function fetchAccounts(isManual = false) {
      const refreshIcon = document.getElementById('refreshIcon');
      const countEl = document.getElementById('accountCountText');
      const timeEl = document.getElementById('lastCheckTimeText');

      if (isManual) {
        refreshIcon.style.display = 'inline-block';
        refreshIcon.style.transform = 'rotate(360deg)';
        refreshIcon.style.transition = 'transform 0.5s';
      }

      try {
        const res = await fetch('/api/appleid');
        const data = await res.json();

        if (data.success && Array.isArray(data.accounts)) {
          allAccounts = data.accounts;
          renderRegionTabs();
          applyFilterAndRender();
        } else {
          throw new Error(data.error || "数据格式错误");
        }
      } catch (err) {
        document.getElementById('accountContainer').innerHTML = `
          <div class="empty-state">
            ❌ 同步异常：${err.message}<br>
            <button class="btn-refresh" style="margin: 14px auto 0;" onclick="fetchAccounts(true)">点击重试</button>
          </div>
        `;
        countEl.innerText = "同步失败";
      } finally {
        const d = new Date();
        timeEl.innerText = `最后同步: ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}`;
        if (isManual) {
          setTimeout(() => {
            refreshIcon.style.transform = 'none';
            refreshIcon.style.transition = 'none';
          }, 500);
        }
      }
    }

    function renderRegionTabs() {
      const tabsBox = document.getElementById('regionTabs');
      const regionCounts = {};

      allAccounts.forEach(item => {
        const reg = item.region || '美国';
        regionCounts[reg] = (regionCounts[reg] || 0) + 1;
      });

      const regions = Object.keys(regionCounts);
      let tabsHtml = `<button class="filter-chip ${currentFilter === 'all' ? 'active' : ''}" onclick="setFilter('all', this)">全部 (${allAccounts.length})</button>`;

      regions.forEach(reg => {
        const isActive = currentFilter === reg ? 'active' : '';
        tabsHtml += `<button class="filter-chip ${isActive}" onclick="setFilter('${escapeHtml(reg)}', this)">${escapeHtml(reg)} (${regionCounts[reg]})</button>`;
      });

      tabsBox.innerHTML = tabsHtml;
    }

    function setFilter(region, btnEl) {
      currentFilter = region;
      document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      applyFilterAndRender();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
      applyFilterAndRender();
    }

    function applyFilterAndRender() {
      let filtered = allAccounts;

      if (currentFilter !== 'all') {
        filtered = filtered.filter(item => item.region === currentFilter);
      }

      if (searchQuery) {
        filtered = filtered.filter(item => 
          (item.account && item.account.toLowerCase().includes(searchQuery)) ||
          (item.region && item.region.toLowerCase().includes(searchQuery))
        );
      }

      document.getElementById('accountCountText').innerText = `共同步到 ${allAccounts.length} 个账号 · 当前展示 ${filtered.length} 个`;
      renderCards(filtered);
    }

    function renderCards(list) {
      const container = document.getElementById('accountContainer');

      if (list.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            🍃 没有找到匹配条件的 Apple ID 账号。
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="card">
          <div>
            <div class="card-header">
              <span class="card-region">📍 ${escapeHtml(item.region)}</span>
              <span class="card-time">${escapeHtml(item.update_time)}</span>
            </div>

            <div class="card-row">
              <div class="card-label">Apple ID (账号)</div>
              <div class="card-val-box">
                <span class="card-val-text" title="${escapeHtml(item.account)}">${escapeHtml(item.account)}</span>
                <button class="btn-copy" onclick="copyText('${escapeHtml(item.account)}', this)">复制</button>
              </div>
            </div>

            <div class="card-row">
              <div class="card-label">Password (密码)</div>
              <div class="card-val-box">
                <span class="card-val-text" title="${escapeHtml(item.password)}">${escapeHtml(item.password)}</span>
                <button class="btn-copy" onclick="copyText('${escapeHtml(item.password)}', this)">复制</button>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(s) {
      return (s || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetchAccounts();
      // 每 3 分钟自动发起一次后台同步检测
      setInterval(() => fetchAccounts(false), 3 * 60 * 1000);
    });
  </script>
</body>
</html>
